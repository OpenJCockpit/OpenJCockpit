# litellm: model and MCP gateway. Admin UI disabled. Root filesystem writable (Prisma client
# generation at start); still non-root, no capabilities, no privilege escalation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels:
    app.kubernetes.io/name: litellm
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/part-of: openjcockpit
      annotations:
        prometheus.io/scrape: 'false'
        prometheus.io/port: '9090'
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: openjcockpit
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 60
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:v1.101.6@sha256:fc0e36a0965e4ffe75bc509b3a1085f5d6c6b78b16efa2ffbb525e122e51f83b
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 4000
        env:
        - name: CONFIG_FILE_PATH
          value: /app/config.yaml
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: openjcockpit-settings
              key: DB_HOST
        - name: LITELLM_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openjcockpit-secrets
              key: LITELLM_DB_PASSWORD
        - name: DATABASE_URL
          value: postgresql://litellm_app:$(LITELLM_DB_PASSWORD)@$(DB_HOST):5432/litellm
        - name: ENFORCE_PRISMA_MIGRATION_CHECK
          value: 'True'
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: openjcockpit-secrets
              key: LITELLM_MASTER_KEY
        - name: LITELLM_SALT_KEY
          valueFrom:
            secretKeyRef:
              name: openjcockpit-secrets
              key: LITELLM_SALT_KEY
        - name: DISABLE_ADMIN_UI
          value: 'True'
        - name: STORE_MODEL_IN_DB
          value: 'True'
        - name: OLLAMA_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: openjcockpit-settings
              key: OLLAMA_BASE_URL
        - name: OLLAMA_MODEL
          valueFrom:
            configMapKeyRef:
              name: openjcockpit-settings
              key: OLLAMA_MODEL
        - name: JSON_LOGS
          value: 'True'
        - name: HOME
          value: /tmp
        resources:
          requests:
            cpu: 250m
            memory: 2Gi
          limits:
            cpu: '2'
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
          readOnly: true
        startupProbe:
          httpGet:
            path: /health/liveliness
            port: http
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: http
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: http
          periodSeconds: 10
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: config
        configMap:
          name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  labels:
    app.kubernetes.io/name: litellm
spec:
  selector:
    app.kubernetes.io/name: litellm
  ports:
  - name: http
    port: 4000
    targetPort: http

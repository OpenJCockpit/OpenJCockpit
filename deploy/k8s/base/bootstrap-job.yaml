# One-shot, idempotent bootstrap run on every deploy (deploy-k8s.sh deletes and re-creates it): realm roles,
# Keycloak service clients and LiteLLM virtual keys, all from openjcockpit-secrets. Creates NO users.
apiVersion: batch/v1
kind: Job
metadata:
  name: openjcockpit-bootstrap
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: openjcockpit-bootstrap, app.kubernetes.io/part-of: openjcockpit}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: openjcockpit
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bootstrap
          image: curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
          command: ["/bin/sh", "-c", "sh /seed/seed-realm-roles.sh && sh /seed/keycloak-service-clients.sh && sh /seed/litellm-keys.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
          env:
            - {name: KC_URL, value: "http://keycloak:8080"}
            - {name: KC_REALM, value: openjcockpit}
            - {name: KC_ADMIN_ROLE_USERS, value: ""}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, valueFrom: {secretKeyRef: {name: openjcockpit-secrets, key: KC_BOOTSTRAP_ADMIN_USERNAME}}}
            - {name: KC_BOOTSTRAP_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: openjcockpit-secrets, key: KC_BOOTSTRAP_ADMIN_PASSWORD}}}
            - {name: LITELLM_URL, value: "http://litellm:4000"}
            - {name: LITELLM_MASTER_KEY, valueFrom: {secretKeyRef: {name: openjcockpit-secrets, key: LITELLM_MASTER_KEY}}}
            - {name: LITELLM_VIRTUAL_KEY, valueFrom: {secretKeyRef: {name: openjcockpit-secrets, key: LITELLM_VIRTUAL_KEY}}}
            - {name: LITELLM_KEY_ALIAS, value: embabel-agent-runtime}
            - {name: LITELLM_KEY_MODEL, valueFrom: {configMapKeyRef: {name: openjcockpit-settings, key: OLLAMA_MODEL}}}
            - {name: LITELLM_A2A_KEY, valueFrom: {secretKeyRef: {name: openjcockpit-secrets, key: LITELLM_A2A_KEY}}}
            - {name: LITELLM_AI_CONTROL_KEY, valueFrom: {secretKeyRef: {name: openjcockpit-secrets, key: LITELLM_AI_CONTROL_KEY}}}
            - {name: LITELLM_AGENT_SERVICE_KEY, valueFrom: {secretKeyRef: {name: openjcockpit-secrets, key: LITELLM_AGENT_SERVICE_KEY}}}
            - {name: A2A_CLIENT_ID, value: openjcockpit-a2a}
            - {name: A2A_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: openjcockpit-secrets, key: A2A_CLIENT_SECRET}}}
            - {name: A2A_TENANT_CLAIM, value: tenant_id}
            - {name: A2A_TENANT, valueFrom: {configMapKeyRef: {name: openjcockpit-settings, key: AGENT_WORKFLOWS_TENANT}}}
            - {name: GIT_MCP_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: openjcockpit-secrets, key: GIT_MCP_CLIENT_SECRET}}}
            - {name: AI_CONTROL_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: openjcockpit-secrets, key: AI_CONTROL_CLIENT_SECRET}}}
            - {name: AGENT_SERVICE_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: openjcockpit-secrets, key: AGENT_SERVICE_CLIENT_SECRET}}}
            - {name: AGENT_RUNTIME_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: openjcockpit-secrets, key: AGENT_RUNTIME_CLIENT_SECRET}}}
          volumeMounts:
            - {name: seed, mountPath: /seed, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: seed
          configMap: {name: bootstrap-scripts}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}

# Prometheus for the VM profile (deploy/compose, `--profile monitoring`). Scrapes the services' management
# ports on the internal network; nothing here is reachable from the internet.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels: {deployment: openjcockpit}

rule_files: [/etc/prometheus/alerts.rules.yml]

alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

scrape_configs:
  - job_name: ai-control-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["ai-control-service:9090"]}]
  - job_name: embabel-agent-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["embabel-agent-service:9090"]}]
  - job_name: embabel-agent-runtime
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["embabel-agent-runtime:9090"]}]
  - job_name: git-mcp-server
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["git-mcp-server:9090"]}]
  - job_name: keycloak
    metrics_path: /metrics
    static_configs: [{targets: ["keycloak:9000"]}]
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]

# OpenJCockpit operational alerts. Single source for both profiles:
#   VM:         loaded by deploy/monitoring/prometheus.yml
#   Kubernetes: rendered into deploy/k8s/components/monitoring/prometheusrule.yaml
#               (deploy/scripts/render-prometheusrule.sh; CI fails when it is stale)
# Every alert links to its runbook section in docs/readme/operations/production-runbook.md.
groups:
  - name: openjcockpit-availability
    rules:
      - alert: OpenJCockpitServiceDown
        expr: up{job=~"ai-control-service|embabel-agent-service|embabel-agent-runtime|git-mcp-server|keycloak"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "{{ $labels.job }} has not answered a metrics scrape for 2 minutes."
          runbook: docs/readme/operations/production-runbook.md#service-down
      - alert: OpenJCockpitServiceAbsent
        expr: absent(up{job="embabel-agent-service"}) or absent(up{job="ai-control-service"})
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "A core service is not being scraped at all"
          runbook: docs/readme/operations/production-runbook.md#service-down

  - name: openjcockpit-errors
    rules:
      - alert: OpenJCockpitHighServerErrorRate
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum by (job) (rate(http_server_requests_seconds_count[5m])), 1e-9) > 0.05
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }}: more than 5% of requests fail with 5xx"
          runbook: docs/readme/operations/production-runbook.md#critical-errors
      - alert: OpenJCockpitPolicyEngineUnavailable
        expr: sum(increase(openjcockpit_policy_decisions_total{result="POLICY_UNAVAILABLE"}[5m])) > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "OPA is unreachable: workflow starts and tool calls are being refused (fail closed)"
          runbook: docs/readme/operations/production-runbook.md#policy-engine-unavailable
      - alert: OpenJCockpitPolicyEnforcementDisabled
        expr: sum(increase(openjcockpit_policy_decisions_total{result="SKIPPED_DISABLED"}[15m])) > 0
        labels: {severity: critical}
        annotations:
          summary: "Policy decisions are being skipped (OPA disabled) -- must never happen in production"
          runbook: docs/readme/operations/production-runbook.md#policy-violations

  - name: openjcockpit-security
    rules:
      - alert: OpenJCockpitAuthFailureSpike
        expr: sum(rate(http_server_requests_seconds_count{status="401"}[5m])) * 300 > 50
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "More than 50 unauthenticated API calls per 5 minutes (token misuse or scanning)"
          runbook: docs/readme/operations/production-runbook.md#auth-failures
      - alert: OpenJCockpitAccessDeniedSpike
        expr: sum by (job) (rate(http_server_requests_seconds_count{status="403"}[5m])) * 300 > 25
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.job }}: more than 25 forbidden requests per 5 minutes (role misuse or misconfiguration)"
          runbook: docs/readme/operations/production-runbook.md#auth-failures
      - alert: OpenJCockpitKeycloakLoginFailures
        expr: sum(rate(keycloak_user_events_total{event="login",error!=""}[5m])) * 300 > 20
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "More than 20 failed logins per 5 minutes (brute force?)"
          runbook: docs/readme/operations/production-runbook.md#auth-failures
      - alert: OpenJCockpitPolicyDenialSpike
        expr: sum by (action) (increase(openjcockpit_policy_decisions_total{result="DENIED"}[15m])) > 10
        labels: {severity: warning}
        annotations:
          summary: "More than 10 policy denials for {{ $labels.action }} in 15 minutes (guardrail triggering)"
          runbook: docs/readme/operations/production-runbook.md#policy-violations

  - name: openjcockpit-saturation
    rules:
      - alert: OpenJCockpitJvmHeapHigh
        expr: |
          sum by (job) (jvm_memory_used_bytes{area="heap"}) / sum by (job) (jvm_memory_max_bytes{area="heap"} > 0) > 0.9
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.job }}: heap above 90% for 10 minutes"
          runbook: docs/readme/operations/production-runbook.md#resource-saturation
      - alert: OpenJCockpitCpuSaturated
        expr: avg by (job) (process_cpu_usage) > 0.9
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.job }}: CPU above 90% of its limit for 15 minutes"
          runbook: docs/readme/operations/production-runbook.md#resource-saturation
      - alert: OpenJCockpitDbPoolExhausted
        expr: max by (job) (hikaricp_connections_pending) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.job }}: requests are waiting for a database connection"
          runbook: docs/readme/operations/production-runbook.md#resource-saturation
      - alert: OpenJCockpitDiskAlmostFull
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.1
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.mountpoint }} has less than 10% free space"
          runbook: docs/readme/operations/production-runbook.md#resource-saturation
      - alert: OpenJCockpitApprovalsWaiting
        expr: max(openjcockpit_approval_paused_runs) > 0 and max_over_time(openjcockpit_approval_paused_runs[24h]) > 0 and min_over_time(openjcockpit_approval_paused_runs[24h]) > 0
        labels: {severity: info}
        annotations:
          summary: "Runs have been waiting at approval gates for over 24 hours"
          runbook: docs/readme/operations/production-runbook.md#approvals-waiting

  - name: openjcockpit-backup
    rules:
      - alert: OpenJCockpitBackupTooOld
        expr: |
          (time() - max(openjcockpit_backup_last_success_timestamp_seconds) > 26 * 3600)
            or (time() - max(kube_cronjob_status_last_successful_time{cronjob="openjcockpit-backup"}) > 26 * 3600)
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: "No successful backup in the last 26 hours"
          runbook: docs/readme/operations/production-runbook.md#backup-problems
      - alert: OpenJCockpitBackupMissing
        expr: absent(openjcockpit_backup_last_success_timestamp_seconds) and absent(kube_cronjob_status_last_successful_time{cronjob="openjcockpit-backup"})
        for: 26h
        labels: {severity: critical}
        annotations:
          summary: "No backup has ever been recorded"
          runbook: docs/readme/operations/production-runbook.md#backup-problems
      - alert: OpenJCockpitBackupJobFailed
        expr: kube_job_status_failed{job_name=~"openjcockpit-backup-.*"} > 0
        labels: {severity: critical}
        annotations:
          summary: "Backup job {{ $labels.job_name }} failed"
          runbook: docs/readme/operations/production-runbook.md#backup-problems

spring:
  web:
    error:
      include-message: always
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: test
    mcp:
      client:
        enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/realms/openjcockpit/protocol/openid-connect/certs
openjcockpit:
  security:
    jwt-issuer: http://localhost:8080/realms/openjcockpit
  # tests opt in to configuration-driven agents explicitly
  agent-definitions:
    enabled: false
embabel:
  agent-platform:
    scanning:
      auto: false
  models:
    default-llm: test-llm
    default-embedding-model: test
    embedding-services:
      best: test
      cheapest: test
    llms:
      best: test-llm
      cheapest: test-llm

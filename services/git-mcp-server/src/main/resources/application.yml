server:
  port: 8093

spring:
  application:
    name: git-mcp-server
  ai:
    mcp:
      server:
        name: openjcockpit-git-mcp-server
        version: 0.1.0
        # Spring AI 2.0.1 changed the default value of spring.ai.mcp.server.protocol from SSE-based to streamable
        # (Streamable HTTP) and deprecated sse-endpoint/sse-message-endpoint. This service's paired MCP client
        # (in embabel-agent-service) uses HttpClientSseClientTransport, which is SSE-only. Silently taking the new
        # streamable default would compile and unit-test fine but break the wire connection. Pinning protocol: sse
        # here preserves the existing transport exactly (see ADR-005).
        protocol: sse

openjcockpit:
  git-mcp:
    workspace-base-path: ${GIT_MCP_WORKSPACE_BASE:${java.io.tmpdir}/git-mcp-workspaces}
    timeout-seconds: ${GIT_MCP_TIMEOUT_SECONDS:120}
    run-workspace-retention: ${GIT_MCP_RUN_WORKSPACE_RETENTION:PT24H}
    run-workspace-reap-interval: ${GIT_MCP_RUN_WORKSPACE_REAP_INTERVAL:PT1H}

management:
  endpoints:
    web:
      exposure:
        include: health,info

gitCredentials:
  get:
    tags:
      - GitCredential
    operationId: getCredentials
    summary: Get the Git credential metadata for a project (never includes the secret itself)
    parameters:
      - $ref: '../schemas/common.yaml#/parameters/ProjectIdPathParam'
    responses:
      '200':
        description: Credential metadata (NONE/no secret if none saved)
        content:
          application/json:
            schema:
              $ref: '../schemas/git.yaml#/ProjectGitCredentialDto'
  post:
    tags:
      - GitCredential
    operationId: saveCredentials
    summary: Save (and verify, if applicable) Git credentials for a project
    parameters:
      - $ref: '../schemas/common.yaml#/parameters/ProjectIdPathParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/git.yaml#/ProjectGitCredentialRequest'
    responses:
      '201':
        description: Credentials saved (and verified against the Git remote if the type requires it)
        content:
          application/json:
            schema: {}
      '400':
        description: Missing secret for the chosen credential type, or the project has no Git URL configured
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      '422':
        description: Credentials could not be verified against the Git remote
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
  delete:
    tags:
      - GitCredential
    operationId: deleteCredentials
    summary: Deactivate the Git credentials for a project
    parameters:
      - $ref: '../schemas/common.yaml#/parameters/ProjectIdPathParam'
    responses:
      '204':
        description: Credentials deactivated

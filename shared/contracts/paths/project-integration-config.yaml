hermesConfig:
  get:
    tags:
      - ProjectIntegrationConfig
    operationId: getHermesConfig
    summary: Get the Hermes integration config for a project
    parameters:
      - $ref: '../schemas/common.yaml#/parameters/ProjectIdPathParam'
    responses:
      '200':
        description: Hermes config (defaults if none saved)
        content:
          application/json:
            schema:
              $ref: '../schemas/project.yaml#/ProjectHermesConfigDto'
  post:
    tags:
      - ProjectIntegrationConfig
    operationId: saveHermesConfig
    summary: Save the Hermes integration config for a project
    parameters:
      - $ref: '../schemas/common.yaml#/parameters/ProjectIdPathParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/project.yaml#/ProjectHermesConfigRequest'
    responses:
      '201':
        description: Hermes config saved
        content:
          application/json:
            schema:
              $ref: '../schemas/project.yaml#/ProjectHermesConfigDto'
  delete:
    tags:
      - ProjectIntegrationConfig
    operationId: deleteHermesConfig
    summary: Deactivate the Hermes integration config for a project
    parameters:
      - $ref: '../schemas/common.yaml#/parameters/ProjectIdPathParam'
    responses:
      '204':
        description: Hermes config deactivated


agentRunById:
  get:
    tags:
      - Agent
    operationId: getAgentRun
    summary: Get the latest state of an agent run
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Agent run
        content:
          application/json:
            schema:
              $ref: '../schemas/agent.yaml#/AgentRunDto'
  delete:
    tags:
      - Agent
    operationId: stopAgentRun
    summary: Stop an agent run
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
    responses:
      '204':
        description: Agent run stopped

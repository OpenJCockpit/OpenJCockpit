GitCredentialType:
  type: string
  enum:
    - NONE
    - HTTPS_TOKEN
    - USERNAME_PASSWORD
    - GITHUB_PAT
    - GITHUB_APP

GitStatus:
  type: string
  enum:
    - UNKNOWN
    - ACCESSIBLE
    - NOT_ACCESSIBLE
    - CHECK_FAILED

ProjectGitStatusDto:
  type: object
  required:
    - projectId
    - gitStatus
  properties:
    projectId:
      type: string
      format: uuid
    gitStatus:
      $ref: '#/GitStatus'
    gitStatusCheckedAt:
      type: string
      format: date-time
    gitStatusMessage:
      type: string

ProjectGitCredentialDto:
  type: object
  required:
    - credentialType
    - hasSecret
  properties:
    credentialType:
      $ref: '#/GitCredentialType'
    username:
      type: string
    githubApiUrl:
      type: string
    hasSecret:
      type: boolean

ProjectGitCredentialRequest:
  type: object
  required:
    - credentialType
  properties:
    credentialType:
      $ref: '#/GitCredentialType'
    username:
      type: string
    secret:
      type: string
      nullable: true
    githubApiUrl:
      type: string

GitConnectionCheckRequest:
  type: object
  description: >-
    A Git URL and credentials to test before any project exists. Nothing is persisted.
    The secret is used for this call only and is never logged or echoed.
  required:
    - gitUrl
  properties:
    gitUrl:
      type: string
      description: Must use the https, ssh or git scheme (scp-style git@host:org/repo is treated as ssh).
    credentialType:
      $ref: '#/GitCredentialType'
    username:
      type: string
    secret:
      type: string
      nullable: true
      writeOnly: true
    githubApiUrl:
      type: string
      description: Optional GitHub Enterprise API base URL; must use https.

GitConnectionCheckResult:
  type: object
  required:
    - gitStatus
    - warnings
  properties:
    gitStatus:
      $ref: '#/GitStatus'
    message:
      type: string
      description: A fixed, friendly message. Never raw exception text.
    warnings:
      type: array
      description: >-
        Non-blocking findings about the target host, resolved from its IP addresses.
        Known values are host_loopback, host_link_local and host_private.
      items:
        type: string

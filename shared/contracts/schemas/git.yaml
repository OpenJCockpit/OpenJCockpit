GitCredentialType:
  type: string
  enum:
    - NONE
    - HTTPS_TOKEN
    - USERNAME_PASSWORD
    - GITHUB_PAT
    - GITHUB_APP

GitStatus:
  type: string
  enum:
    - UNKNOWN
    - ACCESSIBLE
    - NOT_ACCESSIBLE
    - CHECK_FAILED

ProjectGitStatusDto:
  type: object
  required:
    - projectId
    - gitStatus
  properties:
    projectId:
      type: string
      format: uuid
    gitStatus:
      $ref: '#/GitStatus'
    gitStatusCheckedAt:
      type: string
      format: date-time
    gitStatusMessage:
      type: string

ProjectGitCredentialDto:
  type: object
  required:
    - credentialType
    - hasSecret
  properties:
    credentialType:
      $ref: '#/GitCredentialType'
    username:
      type: string
    githubApiUrl:
      type: string
    hasSecret:
      type: boolean

ProjectGitCredentialRequest:
  type: object
  required:
    - credentialType
  properties:
    credentialType:
      $ref: '#/GitCredentialType'
    username:
      type: string
    secret:
      type: string
      nullable: true
    githubApiUrl:
      type: string

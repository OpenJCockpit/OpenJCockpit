Workspace:
  type: object
  required:
    - customer
    - selectedSpecFile
    - specs
    - agents
    - pullRequests
    - evidenceEvents
    - evidenceDetails
    - qualityControls
    - stack
    - footer
  properties:
    customer:
      $ref: '#/CustomerSummary'
    selectedSpecFile:
      type: string
    specs:
      type: array
      items:
        $ref: '#/SpecFile'
    agents:
      type: array
      items:
        $ref: '#/AgentCard'
    pullRequests:
      type: array
      items:
        $ref: '#/PullRequestSummary'
    evidenceEvents:
      type: array
      items:
        $ref: '#/EvidenceEvent'
    evidenceDetails:
      $ref: '#/EvidenceDetails'
    qualityControls:
      type: array
      items:
        $ref: '#/QualityControl'
    stack:
      type: array
      items:
        $ref: '#/StackServiceStatus'
    footer:
      $ref: '#/FooterStatus'

SpecFile:
  type: object
  required:
    - id
    - fileName
    - owner
    - lastChanged
    - status
  properties:
    id:
      type: string
    fileName:
      type: string
    owner:
      type: string
    lastChanged:
      type: string
    status:
      type: string
    selected:
      type: boolean
    content:
      type: string
    repositoryUrl:
      type: string

CustomerSummary:
  type: object
  required:
    - id
    - name
    - sector
    - environment
    - lastActive
    - dataClassification
    - region
  properties:
    id:
      type: string
    name:
      type: string
    sector:
      type: string
    environment:
      type: string
    lastActive:
      type: string
    dataClassification:
      type: string
    region:
      type: string

AgentCard:
  type: object
  required:
    - id
    - name
    - description
    - status
    - statusKind
  properties:
    id:
      type: string
    name:
      type: string
    description:
      type: string
    status:
      type: string
    statusKind:
      type: string
      description: Visual status category the dashboard maps to a status chip colour.
      enum:
        - active
        - done
        - waiting
        - open
        - review
        - changes
        - ok

PullRequestSummary:
  type: object
  required:
    - id
    - title
    - branch
    - createdAt
    - ownerLabel
    - ownerName
    - status
    - statusKind
  properties:
    id:
      type: string
    title:
      type: string
    branch:
      type: string
    createdAt:
      type: string
    ownerLabel:
      type: string
    ownerName:
      type: string
    status:
      type: string
    statusKind:
      type: string
      description: Visual status category the dashboard maps to a status chip colour.
      enum:
        - active
        - done
        - waiting
        - open
        - review
        - changes
        - ok

EvidenceEvent:
  type: object
  required:
    - time
    - title
    - actor
    - status
  properties:
    time:
      type: string
    title:
      type: string
    actor:
      type: string
    status:
      type: string

EvidenceDetails:
  type: object
  required:
    - specVersion
    - runId
    - agentFlow
    - lastUpdate
  properties:
    specVersion:
      type: string
    runId:
      type: string
    agentFlow:
      type: string
    lastUpdate:
      type: string

QualityControl:
  type: object
  required:
    - name
    - status
    - statusText
  properties:
    name:
      type: string
    status:
      type: string
    statusText:
      type: string

StackServiceStatus:
  type: object
  required:
    - name
    - description
    - status
  properties:
    name:
      type: string
    description:
      type: string
    status:
      type: string

FooterStatus:
  type: object
  required:
    - environment
    - region
    - dataClassification
    - embabelVersion
    - springAiControlVersion
  properties:
    environment:
      type: string
    region:
      type: string
    dataClassification:
      type: string
    embabelVersion:
      type: string
    springAiControlVersion:
      type: string

ModelRouteRequest:
  type: object
  required:
    - customerId
    - specFile
    - taskType
  properties:
    customerId:
      type: string
    specFile:
      type: string
    dataClassification:
      $ref: '#/DataClassification'
    taskType:
      type: string

ModelRouteDecision:
  type: object
  properties:
    route:
      type: string
    modelProfile:
      type: string
    cloudAllowed:
      type: boolean
    reason:
      type: string
    requiredControls:
      type: array
      items:
        type: string

DataClassification:
  type: string
  enum:
    - L0_PUBLIC
    - L1_INTERNAL
    - L2_CONFIDENTIAL
    - L3_PERSONAL
    - L4_SECRET

AgentEventDto:
  type: object
  required:
    - timestamp
    - agentId
    - title
    - status
    - evidenceRef
  properties:
    timestamp:
      type: string
      format: date-time
    agentId:
      type: string
    title:
      type: string
    status:
      type: string
    evidenceRef:
      type: string

AgentRunDto:
  type: object
  required:
    - runId
    - customerId
    - specFile
    - repositoryUrl
    - status
    - startedAt
    - events
    - generatedArtifacts
  properties:
    runId:
      type: string
    customerId:
      type: string
    specFile:
      type: string
    repositoryUrl:
      type: string
    status:
      type: string
    startedAt:
      type: string
      format: date-time
    events:
      type: array
      items:
        $ref: '#/AgentEventDto'
    generatedArtifacts:
      type: array
      items:
        type: string
    workflowId:
      type: string
      nullable: true
    startedBy:
      type: string
      nullable: true
    completedAt:
      type: string
      format: date-time
      nullable: true
    failureSummary:
      type: string
      nullable: true
      maxLength: 512
      description: >-
        Sanitised, bounded summary of the terminal failure of a FAILED run: the
        exception class chain plus an allow-listed, non-sensitive reason. Null for
        every run whose status is not FAILED. Never contains a raw exception
        message, a file system path, a repository URL, a credential, prompt text
        or spec content — the raw message is never read at any depth of the cause
        chain. Bounded to 512 characters; a longer value is truncated with a
        trailing "..." marker.

McpToolRefDto:
  type: object
  required:
    - name
    - description
  properties:
    name:
      type: string
    description:
      type: string

AgentSpecDto:
  type: object
  required:
    - name
    - description
    - role
    - instructions
    - subagentNames
    - skillNames
    - mcpTools
  properties:
    name:
      type: string
    description:
      type: string
    role:
      type: string
    instructions:
      type: string
    subagentNames:
      type: array
      items:
        type: string
    skillNames:
      type: array
      items:
        type: string
    mcpTools:
      type: array
      items:
        $ref: '#/McpToolRefDto'
    workflowId:
      type: string
    builtIn:
      type: boolean

SkillSpecDto:
  type: object
  required:
    - name
    - description
    - inputContract
    - outputContract
    - executionInstructions
    - mcpTools
  properties:
    name:
      type: string
    description:
      type: string
    inputContract:
      type: string
    outputContract:
      type: string
    executionInstructions:
      type: string
    mcpTools:
      type: array
      items:
        $ref: '#/McpToolRefDto'
    policyNotes:
      type: string

SubagentSpecDto:
  type: object
  required:
    - name
    - parentAgent
    - description
    - responsibilities
    - instructions
    - skillNames
    - mcpTools
  properties:
    name:
      type: string
    parentAgent:
      type: string
    description:
      type: string
    responsibilities:
      type: string
    instructions:
      type: string
    skillNames:
      type: array
      items:
        type: string
    mcpTools:
      type: array
      items:
        $ref: '#/McpToolRefDto'
    workflowId:
      type: string

PromptRequestDto:
  type: object
  required:
    - prompt
  properties:
    prompt:
      type: string

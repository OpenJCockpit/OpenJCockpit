EvidenceSource:
  type: string
  description: Where an evidence event came from.
  enum:
    - agent
    - approval
    - git

EvidenceStatus:
  type: string
  enum:
    - ok
    - running
    - waiting
    - failed

EvidenceTimelineEvent:
  type: object
  description: One entry of the merged agent, approval and git timeline of a run.
  required:
    - timestamp
    - source
    - title
    - status
  properties:
    timestamp:
      type: string
      format: date-time
    source:
      $ref: '#/EvidenceSource'
    agentId:
      type: string
      nullable: true
      description: Agent that produced the event (agent source only).
    actor:
      type: string
      nullable: true
      description: Person who made the decision (approval source only).
    title:
      type: string
      description: Short, single-line summary.
    detail:
      type: string
      nullable: true
      description: Remainder of the text when the title was shortened, or the decision comment or git message.
    outputRef:
      type: string
      nullable: true
      description: Agent key to pass to the outputs endpoint for the full output. Never the raw agent-output URI.
    status:
      $ref: '#/EvidenceStatus'

EvidenceRunDetails:
  type: object
  required:
    - runId
    - status
    - artifacts
  properties:
    runId:
      type: string
    workflowId:
      type: string
      nullable: true
    status:
      type: string
      description: Run status reported by the agent service, or the git job status when the agent service is unreachable.
    startedBy:
      type: string
      nullable: true
    startedAt:
      type: string
      format: date-time
      nullable: true
    completedAt:
      type: string
      format: date-time
      nullable: true
    branch:
      type: string
      nullable: true
    commitHash:
      type: string
      nullable: true
    artifacts:
      type: array
      items:
        type: string
    failureSummary:
      type: string
      nullable: true

EvidenceRun:
  type: object
  required:
    - details
    - events
  properties:
    details:
      $ref: '#/EvidenceRunDetails'
    events:
      type: array
      description: All events sorted by timestamp, oldest first.
      items:
        $ref: '#/EvidenceTimelineEvent'

EvidenceRunSummary:
  type: object
  required:
    - runId
    - status
  properties:
    runId:
      type: string
    workflowId:
      type: string
      nullable: true
    status:
      type: string
    startedAt:
      type: string
      format: date-time
      nullable: true
    completedAt:
      type: string
      format: date-time
      nullable: true
    startedBy:
      type: string
      nullable: true
    branch:
      type: string
      nullable: true
    eventCount:
      type: integer
      format: int32
      nullable: true
      description: Agent events of the run. Null when the agent service could not be reached.
    failedEventCount:
      type: integer
      format: int32
      nullable: true

EvidenceRunPage:
  type: object
  required:
    - items
    - total
    - limit
    - offset
  properties:
    items:
      type: array
      description: Runs of the project, newest first. Empty when the project has no run yet.
      items:
        $ref: '#/EvidenceRunSummary'
    total:
      type: integer
      format: int64
    limit:
      type: integer
      format: int32
    offset:
      type: integer
      format: int32

EvidenceOutput:
  type: object
  required:
    - agentKey
    - output
  properties:
    agentKey:
      type: string
    output:
      type: string

EvidenceExportFormat:
  type: string
  enum:
    - json
    - csv
    - markdown
    - pdf

EvidenceExportScope:
  type: string
  enum:
    - run
    - workflow
    - project

EvidenceExportOutput:
  type: object
  description: Full output of one agent, as included in a JSON export.
  required:
    - agentKey
    - output
  properties:
    agentKey:
      type: string
    output:
      type: string
    truncated:
      type: boolean
      description: True when the output was cut at the size cap.

EvidenceExportRun:
  type: object
  description: One run in an export. `error` is set (and details/events empty) when the run could not be loaded.
  required:
    - runId
    - events
  properties:
    runId:
      type: string
    details:
      $ref: '#/EvidenceRunDetails'
    events:
      type: array
      items:
        $ref: '#/EvidenceTimelineEvent'
    outputs:
      type: array
      description: Present only with includeOutputs=true.
      items:
        $ref: '#/EvidenceExportOutput'
    outputsUnavailable:
      type: boolean
      description: True when outputs were requested but the agent service could not be reached.
    error:
      type: string
      nullable: true

EvidenceExportBundle:
  type: object
  description: JSON export of a workflow or project.
  required:
    - scope
    - exportedAt
    - runs
  properties:
    scope:
      $ref: '#/EvidenceExportScope'
    workflowId:
      type: string
      nullable: true
    exportedAt:
      type: string
      format: date-time
    runs:
      type: array
      items:
        $ref: '#/EvidenceExportRun'

EvidenceExportRequest:
  type: object
  required:
    - scope
    - format
  properties:
    scope:
      type: string
      enum:
        - workflow
        - project
    workflowId:
      type: string
      nullable: true
      description: Required for workflow scope.
    format:
      $ref: '#/EvidenceExportFormat'
    includeOutputs:
      type: boolean
      default: false
    from:
      type: string
      format: date-time
      nullable: true
    to:
      type: string
      format: date-time
      nullable: true

EvidenceExportJobStatus:
  type: string
  enum:
    - queued
    - running
    - done
    - failed
    - cancelled

EvidenceExportJobCreated:
  type: object
  required:
    - jobId
    - status
  properties:
    jobId:
      type: string
      format: uuid
    status:
      $ref: '#/EvidenceExportJobStatus'

EvidenceExportProgress:
  type: object
  required:
    - runsDone
    - runsTotal
  properties:
    runsDone:
      type: integer
      format: int32
    runsTotal:
      type: integer
      format: int32

EvidenceExportJob:
  type: object
  required:
    - jobId
    - status
    - progress
  properties:
    jobId:
      type: string
      format: uuid
    status:
      $ref: '#/EvidenceExportJobStatus'
    progress:
      $ref: '#/EvidenceExportProgress'
    filename:
      type: string
      nullable: true
    sizeBytes:
      type: integer
      format: int64
      nullable: true
    error:
      type: string
      nullable: true
    expiresAt:
      type: string
      format: date-time
      nullable: true

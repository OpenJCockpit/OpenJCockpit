name: Backend CI

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Report Maven version
        run: mvn -v

      - name: Build, test, and verify JaCoCo coverage gate
        run: mvn -B --no-transfer-progress verify

      - name: Upload backend test and coverage reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**

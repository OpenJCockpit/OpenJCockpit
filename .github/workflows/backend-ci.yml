name: Backend CI

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Contract tests compare this repository's compose and LiteLLM wiring with the runtime's own files
    # (services/embabel-agent-service ops tests); with AGENT_RUNTIME_DIR set they require the checkout.
    env:
      AGENT_RUNTIME_DIR: ${{ github.workspace }}/.agent-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out the agent runtime (OpenJCockpit-Agent-Runtime)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: OpenJCockpit/OpenJCockpit-Agent-Runtime
          ref: ${{ vars.AGENT_RUNTIME_REF || 'main' }}
          path: .agent-runtime
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Report Maven version
        run: mvn -v

      - name: Build, test, and verify JaCoCo coverage gate
        run: mvn -B --no-transfer-progress verify

      - name: Upload backend test and coverage reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**

  # Every service is a separate deployable: each image must build on its own from the reactor (no push; the
  # build validates the Dockerfile, the non-root user and the module's -am closure). embabel-agent-runtime is
  # built by the OpenJCockpit-Agent-Runtime repository.
  agent-images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ai-control-service, embabel-agent-service, git-mcp-server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build ${{ matrix.service }} image
        run: docker build --file services/${{ matrix.service }}/Dockerfile --tag openjcockpit/${{ matrix.service }}:ci .

      - name: Image runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint id openjcockpit/${{ matrix.service }}:ci -u)"
          [ "$uid" != 0 ] || { echo "::error::${{ matrix.service }} runs as root"; exit 1; }

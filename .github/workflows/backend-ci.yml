name: Backend CI

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Report Maven version
        run: mvn -v

      - name: Build, test, and verify JaCoCo coverage gate
        run: mvn -B --no-transfer-progress verify

      - name: Upload backend test and coverage reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**

  # The management plane and the execution plane are separate deployables: each image must build on its
  # own from the reactor (no push; the build validates the Dockerfile and the module's -am closure).
  agent-images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [embabel-agent-service, embabel-agent-runtime]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build ${{ matrix.service }} image
        run: docker build --file services/${{ matrix.service }}/Dockerfile --tag openjcockpit/${{ matrix.service }}:ci .

name: Renovate

on:
  # Runs hourly; renovate-config.json's "schedule" gates when PRs are actually
  # opened/updated (weekly, before 6am Europe/Amsterdam). Off-window runs are
  # cheap no-ops but let Renovate pick up urgent (e.g. vulnerability) updates
  # and rebase conflicted branches promptly.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: renovate
  cancel-in-progress: true

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        env:
          LOG_LEVEL: info
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_CONFIG_FILE: renovate-config.json
          RENOVATE_REPOSITORIES: ${{ github.repository }}

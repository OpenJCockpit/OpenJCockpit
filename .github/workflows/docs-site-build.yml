name: Docs site build

# Builds the OpenJCockpit-docs site against this branch's docs/readme/, so a broken link or
# unsupported Markdown is caught in the product PR instead of after merge.

on:
  pull_request:
    paths:
      - "docs/readme/**"
      - ".github/workflows/docs-site-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: product
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: OpenJCockpit/OpenJCockpit-docs
          ref: main
          path: site
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: Build (fails on dead links)
        working-directory: site
        env:
          PRODUCT_DOCS_DIR: ../product
        run: npm run build

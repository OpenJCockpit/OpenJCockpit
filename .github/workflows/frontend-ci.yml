name: Frontend CI

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Nx workspace (apps/dashboard, libs, e2e). Pull requests run only the affected
  # projects; pushes run everything so a missed `affected` edge cannot hide
  # a regression on main. Local Nx cache only (no remote cache), persisted with actions/cache.
  workspace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NX_DAEMON: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Nx task cache: exact key per commit, falling back to the newest cache for the same lockfile.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: frontend/.nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Lint, check styles, test, build (affected on pull requests)
        if: github.event_name == 'pull_request'
        env:
          NX_BASE: origin/${{ github.base_ref }}
        run: npx nx affected --base="$NX_BASE" --head=HEAD -t lint check-styles typecheck test build --outputStyle=stream

      - name: Lint, check styles, test, build (all projects)
        if: github.event_name != 'pull_request'
        run: npx nx run-many -t lint check-styles typecheck test build --outputStyle=stream

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: workspace-nx-logs
          path: frontend/.nx/cache/terminalOutputs
          if-no-files-found: ignore
          retention-days: 7

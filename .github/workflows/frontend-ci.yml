name: Frontend CI

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  # Nx workspace (apps/dashboard, libs, e2e). Pull requests run only the affected
  # projects; pushes run everything so a missed `affected` edge cannot hide
  # a regression on main. Local Nx cache only (no remote cache), persisted with actions/cache.
  workspace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NX_DAEMON: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Nx task cache: exact key per commit, falling back to the newest cache for the same lockfile.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: frontend/.nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

      # Not covered by `affected`: a change under shared/contracts does not touch libs/api.
      - name: Check generated API types are up to date
        run: |
          npx nx run api:generate --skip-nx-cache
          git diff --exit-code -- libs/api/src/generated \
            || { echo "::error::libs/api/src/generated is stale. Run 'npx nx run api:generate' in frontend/ and commit the result."; exit 1; }

      - name: Lint, check styles, typecheck, coverage (runs tests), build (affected on pull requests)
        if: github.event_name == 'pull_request'
        env:
          NX_BASE: origin/${{ github.base_ref }}
        run: npx nx affected --base="$NX_BASE" --head=HEAD -t lint check-styles typecheck coverage build --outputStyle=stream

      - name: Lint, check styles, typecheck, coverage (runs tests), build (all projects)
        if: github.event_name != 'pull_request'
        run: npx nx run-many -t lint check-styles typecheck coverage build --outputStyle=stream

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Frontend coverage"
            echo
            echo "| Project | Lines | Branches |"
            echo "| --- | --- | --- |"
            for f in libs/*/coverage/coverage-summary.json apps/*/coverage/coverage-summary.json; do
              [ -f "$f" ] || continue
              node -e "const t=require('./$f').total;console.log('| $(basename $(dirname $(dirname $f))) | '+t.lines.pct+'% | '+t.branches.pct+'% |')"
            done
          } > "$RUNNER_TEMP/coverage-summary.md"
          cat "$RUNNER_TEMP/coverage-summary.md" >> "$GITHUB_STEP_SUMMARY"

      # Updates the bot's previous comment instead of adding one per push. Fork PRs get a
      # read-only token, so they only get the job summary.
      - name: Comment coverage on pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/coverage-summary.md" --edit-last --create-if-none

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/*/*/coverage
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: workspace-nx-logs
          path: frontend/.nx/cache/terminalOutputs
          if-no-files-found: ignore
          retention-days: 7

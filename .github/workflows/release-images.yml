name: Release images

# Publishes the deployable images for a release tag (vX.Y.Z) to GHCR with an immutable tag equal to the git
# tag. deploy/scripts/deploy-compose.sh and deploy-k8s.sh only accept such tags, which is what makes a
# rollback a redeploy of the previous tag. A CRITICAL vulnerability with a fix available blocks the release.
# The dashboard image is published by the OpenJCockpit-frontend repository under the same vX.Y.Z tag.
# git-mcp-server is not published. The published images must be anonymously pullable. GHCR has no API to
# change a package's visibility, so a maintainer sets it once per package (Package settings → Change
# visibility → Public; the org must allow public packages). Later pushes keep it. The release verifies it
# after each push.
# Before tagging, the release checklist (docs/readme/operations/release-checklist.md) must be complete and
# ci-summary must be green on the tagged commit.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - {name: ai-control-service, dockerfile: services/ai-control-service/Dockerfile, context: .}
          - {name: embabel-agent-service, dockerfile: services/embabel-agent-service/Dockerfile, context: .}
          - {name: embabel-agent-runtime, dockerfile: services/embabel-agent-runtime/Dockerfile, context: .}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Image references must be lowercase; the org name (OpenJCockpit) is not.
      - name: Image name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "OWNER=$owner" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/$owner/${{ matrix.name }}" >> "$GITHUB_ENV"

      - name: Refuse anything but an immutable version tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::'$TAG' is not a release tag"; exit 1; }

      - name: Build
        run: |
          docker build --file "${{ matrix.dockerfile }}" --build-arg BUILD_SHA="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$TAG" \
            --tag "$IMAGE:$TAG" "${{ matrix.context }}"

      - name: Non-root user
        run: |
          uid="$(docker run --rm --entrypoint id "$IMAGE:$TAG" -u)"
          [ "$uid" != 0 ] || { echo "::error::${{ matrix.name }} runs as root"; exit 1; }

      - name: Vulnerability scan (blocks on fixable CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro \
            aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$IMAGE:$TAG"

      - name: Refuse to overwrite an existing release
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$TAG already exists; release tags are immutable"; exit 1
          fi

      - name: Push
        run: |
          docker push "$IMAGE:$TAG"
          echo "### ${{ matrix.name }}: \`$IMAGE@$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG" | cut -d@ -f2)\`" >> "$GITHUB_STEP_SUMMARY"

      # Runs after the push: on a first release the package only exists from this point. A warning, not a
      # failure, because the tag is already published and immutable; a rerun would be refused above.
      - name: Verify the image is publicly pullable
        run: |
          repo="$OWNER/${{ matrix.name }}"
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:$repo:pull" | jq -r '.token // empty' || true)"
          status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token:-none}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/$repo/manifests/$TAG")"
          if [ "$status" = 200 ]; then
            echo "Public: \`docker pull $IMAGE:$TAG\` works without login" >> "$GITHUB_STEP_SUMMARY"
          else
            msg="$IMAGE:$TAG is not publicly pullable (HTTP $status). Set the package to Public once: https://github.com/orgs/$OWNER/packages/container/${{ matrix.name }}/settings"
            echo "::warning::$msg"
            echo ":warning: $msg" >> "$GITHUB_STEP_SUMMARY"
          fi
